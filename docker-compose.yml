services:
  mongodb:
    image: mongo:7.0
    container_name: chronicle-mongodb
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mrtuxcoder/chronicle-backend:latest
    container_name: chronicle-backend
    restart: unless-stopped

    environment:
      MONGODB_URI: mongodb://mongodb:27017/chronicle
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}

    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: ghcr.io/mrtuxcoder/chronicle-frontend:latest
    container_name: chronicle-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mongodb_data: