name: CI Workflow
on:
  push:
    branches:
      - main
  
env:
  MONGO_URI: mongodb://localhost:27017/chronicle_test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  PORT: ${{ secrets.PORT }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: copy repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
                 frontend/package-lock.json
                 backend/package-lock.json

      - name: install dependencies client
        run: npm ci
        working-directory: frontend
      - name: install dependencies server
        run: npm ci
        working-directory: backend
      - name: run lint client
        run: npm run lint
        working-directory: frontend
      - name: run lint server
        run: npm run lint
        working-directory: backend

  test:
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: copy repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
                 frontend/package-lock.json
                 backend/package-lock.json

      - name: install dependencies server
        run: npm ci
        working-directory: backend
      - name: run tests server
        run: npm test
        working-directory: backend

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: copy repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
                 frontend/package-lock.json
                 backend/package-lock.json

      - name: install dependencies
        run: npm ci
        working-directory: frontend

      - name: build frontend
        run: npm run build
        working-directory: frontend

      - name: artifact build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
  deploy:
   needs: build
   runs-on: ubuntu-latest

   steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend-build

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

    - name: Create SSH key
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

    - name: Test SSH
      run: |
        ssh \
          -o StrictHostKeyChecking=no \
          -i private_key.pem \
          "$VM_USER@$VM_HOST" \
          "echo Connected! && hostname && pwd"

    - name: Transfer build files
      run: |
        rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            --rsync-path="sudo rsync" \
          frontend-build/ \ 
          "$VM_USER@$VM_HOST:/var/www/chronicle"