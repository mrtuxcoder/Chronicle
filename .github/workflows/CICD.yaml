name: Chronicle CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # CI - LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint backend
        working-directory: backend
        run: npm run lint


  # ============================================================
  # CI - TEST
  # ============================================================
  test:
    name: Test Backend
    needs: lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/chronicle_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: ${{ secrets.PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test


  # ============================================================
  # CI - BUILD
  # ============================================================
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ----------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      # ----------------------------------------------------------
      # Backend
      # ----------------------------------------------------------
      - name: Prepare backend artifact
        run: |
          mkdir -p backend-build

          rsync -a \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='coverage' \
            backend/ \
            backend-build/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-build/


  # ============================================================
  # CD - DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Lenovo Server
    needs: build
    runs-on: ubuntu-latest

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:

      # ----------------------------------------------------------
      # Download artifacts
      # ----------------------------------------------------------
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      # ----------------------------------------------------------
      # Connect to Tailscale
      # ----------------------------------------------------------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ----------------------------------------------------------
      # Configure SSH
      # ----------------------------------------------------------
      - name: Configure SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

      # ----------------------------------------------------------
      # Verify server connection
      # ----------------------------------------------------------
      - name: Verify server connection
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "echo 'Connected to:' && hostname && echo 'User:' && whoami"

      # ----------------------------------------------------------
      # Deploy frontend
      # ----------------------------------------------------------
      - name: Deploy frontend
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            --rsync-path="sudo rsync" \
            frontend-build/ \
            "$VM_USER@$VM_HOST:/var/www/chronicle/"

      # ----------------------------------------------------------
      # Deploy backend
      # ----------------------------------------------------------
      - name: Deploy backend
        run: |
          ssh \
          -o StrictHostKeyChecking=no \
          -o IdentitiesOnly=yes \
          -i private_key.pem \
          "$VM_USER@$VM_HOST" \
          "sudo mkdir -p /opt/chronicle/releases/$GITHUB_SHA"

          rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i private_key.pem" \
          --rsync-path="sudo rsync" \
           backend-build/ \
          "$VM_USER@$VM_HOST:/opt/chronicle/releases/$GITHUB_SHA/"


      - name: Activate backend release
        run: |
         ssh \
           -o StrictHostKeyChecking=no \
           -o IdentitiesOnly=yes \
           -i private_key.pem \
           "$VM_USER@$VM_HOST" \
           "sudo ln -sfn /opt/chronicle/releases/$GITHUB_SHA /opt/chronicle/current"

      # ----------------------------------------------------------
      # Install production dependencies
      # ----------------------------------------------------------
      - name: Install backend dependencies
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/chronicle/current && npm ci --omit=dev"

      # ----------------------------------------------------------
      # Restart backend
      # ----------------------------------------------------------
      - name: Restart backend
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "pm2 restart chronicle-backend"