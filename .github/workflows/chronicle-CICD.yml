name: Chronicle CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  MONGO_URI: mongodb://localhost:27017/chronicle_test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  PORT: ${{ secrets.PORT }}

jobs:

  # ─────────────────────────────────────────────
  # Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint frontend and backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint backend
        working-directory: backend
        run: npm run lint


  # ─────────────────────────────────────────────
  # Test
  # ─────────────────────────────────────────────
  test:
    name: Test backend
    needs: lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test


  # ─────────────────────────────────────────────
  # Build and publish Docker images
  # ─────────────────────────────────────────────
  docker:
    name: Build and publish Docker images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chronicle-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chronicle-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chronicle-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chronicle-frontend:latest


  # ─────────────────────────────────────────────
  # Deploy to server
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Lenovo
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Create SSH key
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Test SSH connection
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "echo Connected! && hostname"

        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: Copy production Compose file
        run: |
          rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            docker-compose.yml \
            "$VM_USER@$VM_HOST:/opt/chronicle/docker-compose.yml"
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: Pull Docker images
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/chronicle && docker compose pull"
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: Start application
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/chronicle && docker compose up -d --remove-orphans"
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}

      - name: Verify deployment
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            "$VM_USER@$VM_HOST" \
            "cd /opt/chronicle && docker compose ps"
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}